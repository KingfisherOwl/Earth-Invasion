<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Invasion</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="startScreen">
        <h1 id="gameTitle">EARTH INVASION</h1>
        <p id="missionText">MISSION : COLLECT EARTH DATA</p>
        <p class="gameDescription">10問の中からランダムで3問出題されます。<br>
            全問正解を目指そう！</p>
        <button id="startButton">MISSION START</button>
    </div>
    <div id="quizScreen">
        <div class="monitorHeader">
            <span>EARTH INVASION</span><br>
            <span id="missionNumber">MISSION 1 / 3</span>
        </div>

        

        <p id="questionText"></p>
        <div id="choicesArea">
            <button id="choice1"></button>
            <button id="choice2"></button>
            <button id="choice3"></button>
            <button id="choice4"></button>
        </div>
        
        <p id="result"></p>
        <div id="progressArea">
            <p>DATA COLLECTION</p>
            <div id="progressBar">
                <div id="progressFill"></div>
            </div>
        </div>

        <div id="nextButtonArea">
            <button id="nextButton">NEXT MISSION</button>
        </div>
        
    </div>
    <div id="analyzingScreen">
        <h1 id="analyzingTitle">
            ANALYZING...
        </h1>
        <div id="analysisBar">
            <div id="analysisFill"></div>
        </div>
        <p id="analysisPercent">0%</p>
    </div>
    <div id="resultScreen">
        <h1 id="missionComplete"></h1>
        <p id="resultMessage"></p>
        <p id="scoreText"></p>
        <div id="reviewArea">
            <h2>REVIEW</h2>
            <div id="wrongAnswerList"></div>
        </div>
        <button id="restartButton">NEW MISSION</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
