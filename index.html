<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Invasion</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="startScreen" class="panel">
        <h1 id="gameTitle" class="en">EARTH INVASION</h1>
        <p id="missionText" class="en">MISSION : COLLECT EARTH DATA</p>
        <p class="gameDescription jp">あなたの使命は地球のデータを集めることです。<br>
            期待しています。</p>
        <button id="startButton" class="en">MISSION START</button>
    </div>
    <div id="mapScreen" class="panel">

        <h2 class="en">SELECT AREA</h2>
        <p class="mapMessage jp">
            データを収集する地域を選択してください。
        </p>

        <div id="worldMap">

            <!-- 世界地図 -->
            <img src="images/world-map.png" id="worldMapImage" alt="世界地図">

            <!-- 地球基礎 -->
            <div id="basicArea" class="mapArea">
                <button id="basicButton" class="mapAreaButton jp">
                    地球基礎
                </button>

                <div class="areaProgressBar">
                    <div id="basicProgress" class="areaProgressFill"></div>
                </div>

                <p id="basicPercent" class="areaPercent en">0%</p>
            </div>


            <!-- 日本 -->
            <div id="japanArea" class="mapArea">
                <button id="japanButton" class="mapAreaButton jp">
                    日本
                </button>

                <div class="areaProgressBar">
                    <div id="japanProgress" class="areaProgressFill"></div>
                </div>

                <p id="japanPercent" class="areaPercent en">0%</p>
            </div>


            <!-- アジア -->
            <div id="asiaArea" class="mapArea">
                <button id="asiaButton" class="mapAreaButton jp">
                    アジア
                </button>

                <div class="areaProgressBar">
                    <div id="asiaProgress" class="areaProgressFill"></div>
                </div>

                <p id="asiaPercent" class="areaPercent en">0%</p>
            </div>


            <!-- ヨーロッパ -->
            <div id="europeArea" class="mapArea">
                <button id="europeButton" class="mapAreaButton jp">
                    ヨーロッパ
                </button>

                <div class="areaProgressBar">
                    <div id="europeProgress" class="areaProgressFill"></div>
                </div>

                <p id="europePercent" class="areaPercent en">0%</p>
            </div>


            <div id="africaArea" class="mapArea">
                <button id="africaButton" class="mapAreaButton jp">
                    アフリカ
                </button>

                <div class="areaProgressBar">
                    <div id="africaProgress" class="areaProgressFill"></div>
                </div>

                <p id="africaPercent" class="areaPercent en">0%</p>
            </div>

            <div id="northAmericaArea" class="mapArea">
                <button id="northAmericaButton" class="mapAreaButton jp">
                    北アメリカ
                </button>

                <div class="areaProgressBar">
                    <div id="northAmericaProgress" class="areaProgressFill"></div>
                </div>

                <p id="northAmericaPercent" class="areaPercent en">0%</p>
            </div>


            <div id="southAmericaArea" class="mapArea">
                <button id="southAmericaButton" class="mapAreaButton jp">
                    南アメリカ
                </button>

                <div class="areaProgressBar">
                    <div id="southAmericaProgress" class="areaProgressFill"></div>
                </div>

                <p id="southAmericaPercent" class="areaPercent en">0%</p>
            </div>


            <div id="oceaniaArea" class="mapArea">
                <button id="oceaniaButton" class="mapAreaButton jp">
                    オセアニア
                </button>

                <div class="areaProgressBar">
                    <div id="oceaniaProgress" class="areaProgressFill"></div>
                </div>

                <p id="oceaniaPercent" class="areaPercent en">0%</p>
            </div>

        </div>

    </div>

    <div id="quizScreen" class="panel">
        <div class="monitorHeader en">
            <span>EARTH INVASION</span><br>
            <span id="missionNumber">MISSION 1 / 3</span>
        </div>

        <p id="questionText" class="jp"></p>
        <div id="choicesArea">
            <button id="choice1"></button>
            <button id="choice2"></button>
            <button id="choice3"></button>
            <button id="choice4"></button>
        </div>
        <button id="skipButton" class="en">SKIP</button>

        <p id="result"></p>
        <div id="progressArea">
            <p class="en">DATA COLLECTION</p>
            <div id="progressBar">
                <div id="progressFill"></div>
            </div>
        </div>

        <div id="nextButtonArea">
            <button id="nextButton" class="en">NEXT</button>
        </div>
        <div id="particleArea"></div>

    </div>
    <div id="analyzingScreen">
        <h1 id="analyzingTitle" class="en">
            ANALYZING...
        </h1>
        <div id="analysisBar">
            <div id="analysisFill"></div>
        </div>
        <p id="analysisPercent" class="en">0%</p>
    </div>
    <div id="resultScreen" class="panel">
        <h1 id="missionComplete" class="en"></h1>
        <p id="resultMessage" class="en"></p>
        <p id="scoreText" class="en"></p>
        <div id="starRating" class="en"></div>
        <div id="reviewArea">
            <h2>REVIEW</h2>
            <div id="wrongAnswerList"></div>
        </div>
        <button id="restartButton" class="en">NEW MISSION</button>
    </div>
    <script src="questions.js"></script>
    <script src="script.js"></script>
</body>

</html>
